<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — WhatsGroups</title>
<style>
  :root{
    --green:#25d366;
    --green-dark:#1da851;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --bg-soft:#f6fbf7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-icon{width:42px;height:42px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
  .brand h1{font-size:19px;margin:0;}
  a{text-decoration:none;color:inherit;}
  .btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);cursor:pointer;background:#fff;}
  .btn-primary{background:var(--green);color:#fff;border-color:var(--green);}

  main{max-width:900px;margin:0 auto;padding:32px 20px;}
  main h2{font-size:24px;margin:0 0 4px;}
  main p.sub{color:var(--muted);font-size:14px;margin:0 0 28px;}

  .list{display:flex;flex-direction:column;gap:14px;}
  .row{
    border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .row-main{flex:1;min-width:200px;}
  .row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .row-top h3{font-size:16px;margin:0;}
  .row-cat{font-size:12px;color:var(--muted);}
  .row-desc{font-size:13px;color:var(--muted);margin-top:6px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge.Group{background:#e8f9ee;color:var(--green-dark);}
  .badge.Community{background:#eaf1ff;color:#2f5fd6;}
  .badge.Channel{background:#f5e9ff;color:#8b3fd1;}
  .status{font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap;}
  .status.pending{background:#fff7ed;color:#c2680a;}
  .status.approved{background:#e8f9ee;color:var(--green-dark);}
  .status.rejected{background:#fef2f2;color:#dc2626;}
  .empty{text-align:center;padding:70px 20px;color:var(--muted);}
  .empty a{color:var(--green-dark);font-weight:600;}
  .loading{text-align:center;padding:60px 20px;color:var(--muted);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">
    <div class="brand-icon">&#128172;</div>
    <h1>WhatsGroups</h1>
  </a>
  <div style="display:flex;gap:10px;">
    <a href="index.html#register" class="btn btn-primary">+ Register New</a>
    <button class="btn" id="logoutBtn">Log Out</button>
  </div>
</header>

<main>
  <h2>My Registered Groups</h2>
  <p class="sub">Everything you've submitted, and its current review status. To update details, register a new entry — this list can't be edited directly.</p>

  <div id="content" class="loading">Loading your submissions...</div>
</main>

<script>
  const SUPABASE_URL = "https://rzpnlrektqtfykrtqjfw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_qr965NHGS83JhK3QI0V2Eg_vnuKPqO-";
  const TABLE_NAME = "Groups";

  var supabaseClient;

  function startApp() {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    checkSessionAndLoad();
  }

  function cdnFailed() {
    document.getElementById("content").innerHTML = '<div class="empty">Could not load required library. Check your connection and reload.</div>';
  }

  async function checkSessionAndLoad() {
    var sessionResult = await supabaseClient.auth.getSession();
    var session = sessionResult.data.session;

    if (!session) {
      window.location.href = "auth.html";
      return;
    }

    var userId = session.user.id;

    var result = await supabaseClient
      .from(TABLE_NAME)
      .select("*")
      .eq("user_id", userId)
      .order("created_at", { ascending: false });

    var content = document.getElementById("content");

    if (result.error) {
      content.innerHTML = '<div class="empty">Could not load your submissions: ' + result.error.message + '</div>';
      return;
    }

    var rows = result.data || [];

    if (!rows.length) {
      content.innerHTML = '<div class="empty">You haven\'t registered any groups yet. <a href="index.html#register">Register your first one</a>.</div>';
      return;
    }

    content.innerHTML = '<div class="list">' + rows.map(rowHtml).join("") + '</div>';
  }

  function rowHtml(g) {
    var type = g.type || "Group";
    var status = (g.status || "pending").toLowerCase();
    return '<div class="row">' +
      '<div class="row-main">' +
        '<div class="row-top">' +
          '<h3>' + escapeHtml(g.name) + '</h3>' +
          '<span class="badge ' + type + '">' + type + '</span>' +
        '</div>' +
        '<div class="row-cat">' + escapeHtml(g.category || "") + '</div>' +
        (g.description ? '<div class="row-desc">' + escapeHtml(g.description) + '</div>' : '') +
      '</div>' +
      '<span class="status ' + status + '">' + capitalize(status) + '</span>' +
    '</div>';
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, function(m){
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m];
    });
  }

  document.getElementById("logoutBtn").addEventListener("click", async function () {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="startApp()" onerror="cdnFailed()"></script>
</body>
</html>
