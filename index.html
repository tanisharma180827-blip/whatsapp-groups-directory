<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Group Hub</title>
<style>
  :root{
    --bg:#0b1412;
    --panel:#101d19;
    --line:#1f342c;
    --text:#eaf4ee;
    --muted:#8fa89c;
    --accent:#25d366;
    --accent-dim:#1a9c4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    line-height:1.5;
  }
  header{
    padding:48px 20px 32px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:clamp(28px,5vw,42px);
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  header p{
    color:var(--muted);
    margin:0 0 20px;
    font-size:15px;
  }
  .cta{
    display:inline-block;
    background:var(--accent);
    color:#04150c;
    font-weight:700;
    padding:12px 24px;
    border-radius:999px;
    text-decoration:none;
    font-size:14px;
  }
  .cta:hover{background:var(--accent-dim);}
  .search-bar{
    max-width:480px;
    margin:24px auto 0;
    padding:0 20px;
  }
  #search{
    width:100%;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:14px;
  }
  main{
    max-width:1000px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  .category-block{margin-bottom:44px;}
  .category-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--accent);
    margin:0 0 16px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .card h3{
    margin:0;
    font-size:16px;
  }
  .card p{
    margin:0;
    color:var(--muted);
    font-size:13px;
    flex-grow:1;
  }
  .join{
    align-self:flex-start;
    background:var(--accent);
    color:#04150c;
    font-weight:700;
    padding:8px 16px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
    margin-top:4px;
  }
  .join:hover{background:var(--accent-dim);}
  .members{font-size:12px;color:var(--muted);}
  .empty, .loading{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
  }
</style>
</head>
<body>

<header>
  <h1>WhatsApp Group Hub</h1>
  <p>Find and join WhatsApp groups by category.</p>
  <a class="cta" href="submit.html">+ Submit your group</a>
  <div class="search-bar">
    <input id="search" type="text" placeholder="Search groups..." />
  </div>
</header>

<main id="app">
  <div class="loading">Loading groups…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rzpnlrektqtfykrtqjfw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_qr965NHGS83JhK3QI0V2Eg_vnuKPqO-";
  const TABLE_NAME = "groups";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById("app");
  const searchInput = document.getElementById("search");
  let allGroups = [];

  async function loadGroups() {
    const { data, error } = await supabase
      .from(TABLE_NAME)
      .select("*")
      .eq("status", "approved")
      .order("category", { ascending: true });

    if (error) {
      app.innerHTML = `<div class="empty">Couldn't load groups. Check your Supabase config.<br><small>${error.message}</small></div>`;
      console.error(error);
      return;
    }

    allGroups = data || [];
    render(allGroups);
  }

  function render(groups) {
    if (!groups.length) {
      app.innerHTML = `<div class="empty">No groups yet. Be the first to <a href="submit.html" style="color:var(--accent)">submit one</a>.</div>`;
      return;
    }

    const byCategory = {};
    for (const g of groups) {
      const cat = g.category || "Other";
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(g);
    }

    app.innerHTML = Object.keys(byCategory).sort().map(cat => `
      <div class="category-block">
        <h2 class="category-title">${escapeHtml(cat)}</h2>
        <div class="grid">
          ${byCategory[cat].map(cardHtml).join("")}
        </div>
      </div>
    `).join("");
  }

  function cardHtml(g) {
    return `
      <div class="card">
        <h3>${escapeHtml(g.name)}</h3>
        ${g.description ? `<p>${escapeHtml(g.description)}</p>` : ""}
        ${g.member_count ? `<span class="members">${g.member_count} members</span>` : ""}
        <a class="join" href="${escapeAttr(g.invite_link)}" target="_blank" rel="noopener">Join Group</a>
      </div>
    `;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  searchInput.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { render(allGroups); return; }
    render(allGroups.filter(g =>
      (g.name && g.name.toLowerCase().includes(q)) ||
      (g.category && g.category.toLowerCase().includes(q)) ||
      (g.description && g.description.toLowerCase().includes(q))
    ));
  });

  loadGroups();
</script>
</body>
</html>
